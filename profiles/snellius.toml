# Snellius, the Dutch national supercomputer at SURF.
# Values come from the published course text; lines marked "# unverified" were
# not checked on the machine for this file. Schema: see DESIGN.md.

[profile]
name = "snellius"
description = "SURF Snellius, as the published course text describes it"

[render]
# Other profiles whose notes appear in this profile's files. The published
# files carry SRC asides, so the Snellius render includes the src profile's.
asides = ["src"]
course_cluster = "src"

[system]
name = "Snellius"
display_name = "Snellius"
login_host = "snellius.surf.nl"
login_nodes = ["int4", "int5", "int6"]
login_node_first = "int4"
login_node = "int6"
login_node_alt = "int5"
login_node_fqdn = "int6.local.snellius.surf.nl"
archive_host = "archive.surf.nl"
ondemand_url = "https://ondemand.snellius.surf.nl/"
ondemand_display = "https://ondemand.snellius.surf.nl"
interconnect = "InfiniBand"           # fat-tree; generation unverified
peak_pflops = 37.9
compute_nodes = "over 1,500"
processor_summary = "AMD Genoa CPUs and NVIDIA H100 GPUs"
architecture_summary = "1,258 thin rome/genoa nodes + fat/high-memory nodes + 604 GPUs."
network_summary = "fat-tree *InfiniBand HDR100, HDR200, and NDR200*"
storage_summary = "720 TB for home @@beamer:\\textmd{@@directories and@@beamer:}@@ 12.4 PB for scratch and project @@beamer:\\textmd{@@spaces (GPFS).@@beamer:}@@"

[[system.partition_info]]
name = "rome"
nodes = 520
cpus_per_node = 128
[[system.partition_info]]
name = "genoa"
nodes = 736
cpus_per_node = 192
[[system.partition_info]]
name = "gpu_a100"
nodes = 62
gpus_per_node = 4
gpu_model = "NVIDIA A100 40 GB"
[[system.partition_info]]
name = "gpu_h100"
nodes = 88
gpus_per_node = 4
gpu_model = "NVIDIA H100 (SXM5) 94 GB"

[partitions]
# Logical role -> partition name used in job scripts.
cpu = "rome"
cpu_alt = "genoa"
gpu = "gpu_a100"
gpu_alt = "gpu_h100"
fat = "fat_rome"
staging = "staging"
archive = "staging"

[slurm]
account = ""                          # no account directive in course jobs
default_partition = "rome"            # unverified: scripts always name it
min_allocation_cpus = 16              # 1/8 rome node
min_allocation_mem_gib = 28           # per 1/8 rome node, from the QCG slides
gpu_request = "--gpus-per-node=1"
mail = true                           # unverified: slides teach --mail-type
constraints = ["scratch-node", "hwperf"]
scratch_constraint = "scratch-node"
performance_constraint = "hwperf"
max_array_size = 30000

[limits]
max_cpus_per_node = 128
max_nodes = 520

[modules]
stack = "2025"
legacy_stack = "2023"
eessi_version = "2025.06"
eessi_init = "/cvmfs/software.eessi.io/versions/2025.06/init/lmod/bash"
toolchain = "foss/2025a"
compiler = "GCC/14.2.0"
python = "Python/3.13.1-GCCcore-14.2.0"
qcg = "QCG-PilotJob/0.14.1-GCCcore-14.2.0"   # unverified on Snellius
uprof = "AMD-uProf/5.1.701"
scipy = "SciPy-bundle/2025.06-gfbf-2025a"
matplotlib = "matplotlib/3.10.3-gfbf-2025a"
hyperqueue = "HyperQueue/0.24.0"
snakemake = "snakemake/9.22.0-foss-2025b"
fireworks = "FireWorks/2.1.4-gfbf-2025a"
irods = "iRODS-iCommands/4.3.0"
mpifileutils_source = "EESSI 2023.06 and 2025.06"
# Kept to reproduce the current published scripts byte for byte. It is only
# needed by the Research Cloud installation.
site_modulepath = "/cvmfs/course.surf-src.cvmfs/eessi/versions/2025.06/software/linux/x86_64/amd/zen2/modules/all"
# Course style: the stack goes on its own `module load` line.
stack_on_own_line = true

[paths]
home = "/home/$USER"
home_example = "/home/<username>"
scratch_shared = "/scratch-shared/$USER"
scratch_root = "/scratch-shared"
scratch_local = "/scratch-local"      # $TMPDIR outside scratch-node jobs
scratch_local_real = "/gpfs/scratch1/nodespecific/<node>/<user>.<jobid>"
scratch_node = "/scratch-node"
scratch_node_label = "scratch-node"
projects = "/projects"
archive = "/archive"
archive_user = "/archive/$USER"
tmpdir = "/scratch-local/$USER.$SLURM_JOB_ID"

[tools]
myquota = true
accinfo = true
ear = true                            # eacct -j <jobid>
uprof = true
papi = true                           # unverified as a module
perf = true                           # unverified; needs --constraint=hwperf
seff = true
mpifileutils = true                   # site module or an EasyBuild installation

[accounting]
unit = "SBU"
sbu_per_core_hour = 1                 # rome; GPU rates differ

[commands]
quota = "myquota"
accounting = "accinfo"
energy = "eacct"

# ---------------------------------------------------------------- hybrid jobs
# course-module-snellius-hybrid-jobs

[jobs.hybrid.ex1]
nodes = 1
ntasks = 1
ntasks_per_node = 1
cpus_per_task = 16
script = "submit-axpy.sh"

[jobs.hybrid.ex2]
nodes = 1
ntasks = 128
cpus_per_task = 1
script = "submit-axpy-hybrid.sh"
sample_n = 10000000

[jobs.hybrid.ex3]
nodes = 1
ntasks = 1
ntasks_per_node = 1
cpus_per_task = 16
script = "submit-dot.sh"

[jobs.hybrid.ex4]
nodes = 1
ntasks = 128
cpus_per_task = 1
script = "submit-dot-hybrid.sh"
sample_n = 10000000

[jobs.hybrid.ex5]
nodes = 1
ntasks = 1
ntasks_per_node = 1
cpus_per_task = 16
script = "submit-matmul.sh"

[jobs.hybrid.hostname]
# The README's sample solution to the hostname exercise.
nodes = 2
ntasks = 8
ntasks_per_node = 4

[hybrid]
threads_example = 16
cpu_nodes = "partition `rome` with 520 nodes of 128 AMD Rome cores, and partition `genoa` with 736 nodes of 192 AMD Genoa cores, for a total of 207,872 cores"
fat_nodes = "partitions `fat_rome` and `fat_genoa`, 120 nodes, each with 1 TiB or 1.5 TiB of RAM, intended for memory-intensive jobs"
gpu_nodes = "partition `gpu_a100` with 62 nodes of 4 NVIDIA A100 GPUs (and 4 more A100 nodes split into MIG slices in `gpu_mig`), and partition `gpu_h100` with 88 nodes of 4 NVIDIA H100 GPUs, designed for massively parallel computations such as machine learning and molecular dynamics"
# Text under each results table. It renders inside the job's section, so
# {{script}} is the exercise's job script and {{../x}} reaches the profile.
table_note = '''
>
> The last row needs about 160 GB for `x` and `y`. Add `--exclusive` to the job script so that the job gets the memory of a full node.
>
> `Hyb-256-1` and `Hyb-2-128` need 256 cores, two `rome` nodes, while the script asks for one node. Add `--nodes=2` for those columns, for example `sbatch --nodes=2 --ntasks=256 --cpus-per-task=1 {{script}} <N>` and `sbatch --nodes=2 --ntasks=2 --cpus-per-task=128 {{script}} <N>`.'''

[hybrid.table]
first_col = "Vector Size"
first_col_width = 13
columns = ["Sequential", "Hyb-16-1", "Hyb-128-1", "Hyb-256-1", "Hyb-1-16", "Hyb-1-128", "Hyb-2-128"]
sizes = ["1,000,000", "10,000,000", "100,000,000", "1,000,000,000", "10,000,000,000"]

