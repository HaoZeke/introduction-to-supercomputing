[fundamentals]
mpi_compare_a = "--nodes={{jobs.fundamentals.mpi.nodes}} to --"
mpi_compare_b = "nodes={{jobs.fundamentals.mpi_compare.nodes}}"
hello_why = "the most a course job uses on one node"
gpu_result = "On `{{partitions.real_gpu_node}}`, `nvidia-smi` lists two NVIDIA Blackwell cards. The partition also has a node with emulated GPUs, so submit with `sbatch --nodelist={{partitions.real_gpu_node}} gpu.sh` to reach the real cards. The whole class shares those two cards, so keep GPU test jobs short."
course_slide_intro = "The hands-on of this course run on a *course cluster* built from SURF Research Cloud workspaces with the same parts as Snellius: Slurm, the EESSI software stack, a shared file system, a web portal. What you type here works on Snellius; the numbers are smaller."
course_slide_login = "*Login*: =ssh <name>@<manager>= or the web portal; your trainer's setup link makes your password. There is one login node and no SURFcua account."
course_slide_software = "*Software*: =module load 2025= selects EESSI 2025.06. QCG-PilotJob and HyperQueue are installed in the course CernVM-FS repository. Use the exact module commands at =https://supersurf.rgoswami.me/commands=."
course_slide_nodes = "*Nodes*: three nodes with 2 CPUs each and one GPU node with 60 CPUs: *66 CPUs in total*. The GPU node has two RTX PRO 6000 Blackwell cards. =rome= and =thin_course= share the CPU nodes, including that GPU node. Use 1 core for VS Code and 1-2 cores for the small exercises."
course_slide_filesystems = "*File systems*: shared BeeGFS supplies =/home=, =/project= and =/scratch=. =~/scratch= points to =/scratch/$USER=. Each Slurm job has node-local =$TMPDIR=. Omit the Snellius-only =--constraint=scratch-node=. =myquota= reports shared home capacity."
course_slide_budget = "*Budget*: none. The collaboration's wallet pays; =accinfo= and system billing units do not exist; =sacct= reports core-seconds in =CPUTimeRAW=."
# Shown in other profiles' renders, after the GPU job.
gpu_aside = '''
