LOG {
    Default_Log_Level = EVENT;
}

NFS_CORE_PARAM {
    Enable_NLM = false;
    Enable_RQUOTA = false;
    Protocols = 4;
    NFS_Port = 2049;
    mount_path_pseudo = true;
}

NFSv4 {
    Delegations = false;
    RecoveryBackend = fs_ng;
    Minor_Versions = 1, 2;
    Only_Numeric_Owners = true;
    Allow_Numeric_Owners = true;
}

EXPORT_DEFAULTS {
    Access_Type = RW;
    Protocols = 4;
    Transports = TCP;
    Squash = No_Root_Squash;
    SecType = sys;
    Attr_Expiration_Time = 3;
}

# Pseudo root. Clients mount mgmt1:/home, mgmt1:/project and mgmt1:/scratch.
EXPORT {
    Export_Id = 1;
    Path = /export;
    Pseudo = /;
    Access_Type = RW;
    Squash = No_Root_Squash;
    SecType = sys;
    FSAL {
        Name = VFS;
    }
}

EXPORT {
    Export_Id = 10;
    Path = /export/home;
    Pseudo = /home;
    Access_Type = RW;
    Squash = No_Root_Squash;
    SecType = sys;
    FSAL {
        Name = VFS;
    }
}

EXPORT {
    Export_Id = 11;
    Path = /export/project;
    Pseudo = /project;
    Access_Type = RW;
    Squash = No_Root_Squash;
    SecType = sys;
    FSAL {
        Name = VFS;
    }
}

EXPORT {
    Export_Id = 12;
    Path = /export/scratch;
    Pseudo = /scratch;
    Access_Type = RW;
    Squash = No_Root_Squash;
    SecType = sys;
    FSAL {
        Name = VFS;
    }
}
