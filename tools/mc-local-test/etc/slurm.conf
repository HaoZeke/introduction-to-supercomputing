ClusterName=src-eessi
SlurmctldHost=login1
SlurmUser=slurm
AuthType=auth/munge
SlurmctldPort=6817
SlurmdPort=6818
StateSaveLocation=/var/spool/slurm
SlurmdSpoolDir=/var/spool/slurmd
SwitchType=switch/none
MpiDefault=none
ProctrackType=proctrack/cgroup
TaskPlugin=task/affinity,task/cgroup
PrologFlags=contain
ReturnToService=2
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
AccountingStorageType=accounting_storage/none
JobAcctGatherType=jobacct_gather/cgroup
JobAcctGatherParams=NoOverMemoryKill
SlurmctldPidFile=/var/run/slurmctld/slurmctld.pid
SlurmdPidFile=/var/run/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldDebug=info
SlurmdDebug=info
TmpFS=/localscratch
Epilog=/etc/slurm/epilog
PlugStackConfig=/etc/slurm/plugstack.conf
LaunchParameters=use_interactive_step
InteractiveStepOptions="--interactive --mem-per-cpu=0 --preserve-env --pty /bin/bash"
PropagateResourceLimits=NONE
DisableRootJobs=YES

NodeName=node1 CPUs=8 Boards=1 SocketsPerBoard=1 CoresPerSocket=8 ThreadsPerCore=1 RealMemory=16384 State=UNKNOWN
NodeName=node2 CPUs=8 Boards=1 SocketsPerBoard=1 CoresPerSocket=8 ThreadsPerCore=1 RealMemory=16384 State=UNKNOWN
PartitionName=cpubase_bycore_b1 Nodes=node[1-2] Default=YES DefaultTime=01:00:00 DefMemPerCPU=256 MaxTime=UNLIMITED OverSubscribe=YES
